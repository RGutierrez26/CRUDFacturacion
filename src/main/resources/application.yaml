spring:
  application:
    name: TpGrupal
  config:
    import: "optional:application-local.yaml"
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default-schema: facturacion

afip:
  cuit: ${AFIP_CUIT:}
  cert-path: ${AFIP_CERT_PATH:certificado_test.crt}
  key-path: ${AFIP_KEY_PATH:privada_test.key}
  homologacion: true
  wsaa-url: https://wsaahomo.afip.gov.ar/ws/services/LoginCms
  wsfe-url: https://wswhomo.afip.gov.ar/wsfev1/service.asmx
